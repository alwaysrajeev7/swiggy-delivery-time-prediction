
services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: rajeev232001/deliveryeta-backend:1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: rajeev232001/deliveryeta-frontend:1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      API_URL: "http://backend:8000/predict"
    depends_on:
      - backend
  